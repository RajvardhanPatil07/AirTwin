# Local development only. Never use the default local password in production.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airtwin
      POSTGRES_PASSWORD: ${AIRTWIN_DB_PASSWORD:-airtwin_local_only}
      POSTGRES_DB: airtwin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - airtwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airtwin -d airtwin"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://airtwin:${AIRTWIN_DB_PASSWORD:-airtwin_local_only}@postgres:5432/airtwin
      LIVE_REFRESH_ENABLED: ${LIVE_REFRESH_ENABLED:-0}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  airtwin_pgdata:
