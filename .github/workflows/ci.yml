name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    name: Python pipeline and offline fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: bash scripts/pipeline.sh --offline
      - run: python backend/scripts/train_model.py --offline
      - run: python scripts/check_repository.py
      - run: python scripts/check_documentation.py
      - run: python backend/scripts/validate_forecasts.py --offline --horizons 24 --policies pollution_only --output /tmp/seasonal-smoke.json
      - name: Verify connected offline API
        run: |
          LIVE_REFRESH_ENABLED=0 python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8012 > /tmp/airtwin-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8012/api/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/verify_runtime.py --url http://127.0.0.1:8012
  frontend:
    name: Frontend types, lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
