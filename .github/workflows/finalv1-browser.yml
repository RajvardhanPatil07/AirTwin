name: AirTwin finalv1 browser QA

on:
  push:
    branches: [finalv1]
    paths:
      - 'frontend/**'
      - '.github/workflows/finalv1-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalv1-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install headless Chromium for browser verification
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run frontend and verify guest, map, scenarios, forecast, mobile
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/airtwin-frontend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          node tests/finalv1-browser.mjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtwin-finalv1-browser-screenshots
          path: frontend/screenshots/
          if-no-files-found: warn
          retention-days: 14

  connected-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install actual FastAPI and browser dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Generate backend offline dataset and trained model
        run: |
          bash scripts/pipeline.sh --offline
          python backend/scripts/train_model.py --offline
      - name: Start FastAPI and Vite, verify real backend integration
        env:
          LIVE_REFRESH_ENABLED: '0'
          RETRAIN_ENABLED: '0'
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/airtwin-connected-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 65); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/airtwin-connected-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          node tests/finalv1-connected-browser.mjs
      - name: Upload startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: airtwin-finalv1-connected-logs
          path: /tmp/airtwin-connected-*.log
          if-no-files-found: warn
          retention-days: 7
