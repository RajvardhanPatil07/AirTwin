name: AirTwin finalv1 browser QA

on:
  push:
    branches: [finalv1]
    paths:
      - 'frontend/**'
      - '.github/workflows/finalv1-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalv1-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install headless Chromium for browser verification
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run frontend and verify guest, map, scenarios, forecast, mobile
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/airtwin-frontend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          node tests/finalv1-browser.mjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtwin-finalv1-browser-screenshots
          path: frontend/screenshots/
          if-no-files-found: warn
          retention-days: 14
