name: Bug report
description: Report a reproducible AirTwin problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected location, tab, slider values and demo/API mode.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser, viewport, Python/Node versions, screenshot or sanitized logs. Never include keys.
